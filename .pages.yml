media:
  - name: noticias
    label: Fotos de noticias
    input: repositorio/media/noticias
    output: /media/noticias
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: profesionales
    label: Fotos de profesionales
    input: repositorio/media/profesionales
    output: /media/profesionales
    extensions: [jpg, jpeg, png, webp]
    rename: safe
content:
  - name: profesionales
    label: Profesionales
    type: collection
    path: repositorio/content/profesionales
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [nombre, especialidad]
      primary: nombre
      sort: [nombre, especialidad]
    fields:
      - name: nombre
        label: Nombre y apellido
        type: string
        required: true
      - name: especialidad
        label: Especialidad (grupo donde aparece, ej. Psicología)
        type: string
        required: true
      - name: titulo
        label: Título que se muestra (ej. Lic. en Psicología · MP 1234)
        type: string
      - name: descripcion
        label: Descripción
        type: text
      - name: atiende
        label: Atiende (separado por comas, ej. Niños, Adultos, CUD)
        type: string
      - name: whatsapp
        label: WhatsApp (con característica, sin 0 ni 15)
        type: string
      - name: email
        label: Email (opcional)
        type: string
      - name: foto
        label: Foto (opcional)
        type: image
        options:
          media: profesionales
      - name: orden
        label: Orden dentro de su especialidad (número más chico aparece primero)
        type: number
      - name: oculto
        label: Ocultar de la web
        type: boolean
        default: false
  - name: noticias
    label: Noticias
    type: collection
    path: repositorio/content/noticias
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Fecha
        type: date
        required: true
      - name: image
        label: Foto principal
        type: image
        options:
          media: noticias
      - name: summary
        label: Resumen (1 o 2 líneas, aparece en la lista de noticias)
        type: text
      - name: author
        label: Autor/a (opcional)
        type: string
      - name: borrador
        label: Borrador (no se publica mientras esté activado)
        type: boolean
        default: false
      - name: body
        label: Texto de la nota
        type: rich-text
  - name: ajustes
    label: Ajustes (Instagram)
    type: file
    path: repositorio/content/ajustes.json
    format: json
    fields:
      - name: instagram
        label: Usuario de Instagram (sin @)
        type: string
      - name: behold_feed_id
        label: Feed ID de Behold (para mostrar las últimas publicaciones)
        type: string
  - name: precios
    label: Precios del alquiler
    type: file
    path: repositorio/content/precios.json
    format: json
    fields:
      - name: vigencia
        label: Vigentes desde (ej. 1 de febrero de 2027)
        type: string
      - name: g1_hora
        label: Grupo 1 Flexible - hora individual
        type: number
      - name: g1_modulo
        label: Grupo 1 Flexible - módulo 4 h
        type: number
      - name: g2_hora
        label: Grupo 2 Frecuente - hora individual
        type: number
      - name: g2_modulo
        label: Grupo 2 Frecuente - módulo 4 h
        type: number
      - name: g3_hora
        label: Grupo 3 Estable - hora individual
        type: number
      - name: g3_modulo
        label: Grupo 3 Estable - módulo 4 h
        type: number